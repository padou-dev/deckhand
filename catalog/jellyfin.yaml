id: jellyfin
name: Jellyfin
category: media
description: Stream your movies, shows and music to any device.
architectures: [amd64, arm64]
web_port: 8096

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
    restart: unless-stopped