id: paperless_ngx
name: Paperless-ngx
category: productivity
description: Scan, index and search all your paper documents.
architectures: [amd64, arm64]
web_port: 8000

env:
  PAPERLESS_SECRET_KEY: generate
  PAPERLESS_DBPASS: generate
  PAPERLESS_ADMIN_USER: admin
  PAPERLESS_ADMIN_PASSWORD: generate
  PAPERLESS_TIME_ZONE: timezone
  USERMAP_UID: uid
  USERMAP_GID: gid

services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless_broker
    volumes:
      - ./redisdata:/data
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18
    container_name: paperless_db
    volumes:
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless_webserver
    ports:
      - "8000:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
    depends_on:
      - db
      - broker
    restart: unless-stopped