id: wg_easy
name: WireGuard (wg-easy)
category: network
description: WireGuard VPN server with a web UI for adding and managing clients.
architectures: [amd64, arm64]
web_port: 51821
notes: The setup wizard asks for your public IP or domain. To connect from outside your home, forward UDP port 51820 on your router to this server. The web UI is served over plain HTTP, so only use it on your local network.

services:
  wg_easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg_easy
    environment:
      INSECURE: "true"
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - ./config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64